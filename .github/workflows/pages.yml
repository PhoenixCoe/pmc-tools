name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Make sure no secret key is going on the website
        env:
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          python3 - <<'PY'
          import base64, json, os, sys
          key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
          bad = key.startswith("sb_secret_")
          if key.startswith("eyJ"):
              try:
                  p = key.split(".")[1]; p += "=" * (-len(p) % 4)
                  bad = bad or json.loads(base64.urlsafe_b64decode(p)).get("role") == "service_role"
              except Exception:
                  pass
          if bad:
              print("::error::SUPABASE_ANON_KEY is a SECRET key. It must never go on a website. Use the publishable key (sb_publishable_...) or the anon key, and rotate the secret key in Supabase.")
              sys.exit(1)
          PY
      - run: node scripts/restore-routes.mjs
      - run: npm ci
      - run: npm run build:static
        env:
          SITE_URL: https://tools.pmcstudios.uk
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
